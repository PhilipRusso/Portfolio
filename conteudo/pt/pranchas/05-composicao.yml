numeros:
- valor: '3'
  texto: 'modelos de composição: SCI, GDM com distância geográfica e GDM só com o ambiente'
- valor: '3'
  texto: 'métodos de regionalização: CLARA, k-means e Random Forest'
- valor: '21'
  texto: 'mapas: RGB, três eixos e três regionalizações por modelo'
secoes:
- titulo: O problema
  texto: >-
    Riqueza e endemismo não dizem quais regiões têm faunas parecidas. Para regionalizar o continente sem depender
    de fronteiras políticas, é preciso medir como a composição de espécies muda no espaço e ao longo do ambiente.
- titulo: Os dados
  texto: >-
    Os registros da prancha 1 em hexágonos de 1°, e os componentes principais do ambiente usados nas previsões das
    pranchas 2 e 3.
- titulo: O método
  lista_numerada:
  - Dissimilaridade de Bray-Curtis entre hexágonos, resumida por NMDS em três eixos.
  - 'SCI: interpolação da composição, com a distância geográfica como preditora.'
  - 'GDM: composição modelada pelos gradientes ambientais, com e sem a distância geográfica.'
  - Combinação dos três eixos em RGB.
  - 'Regionalização por três métodos de agrupamento: CLARA, k-means e Random Forest.'
- titulo: O resultado
  destaque: >-
    Comparar modelos e métodos mostra quais limites biogeográficos se repetem e quais dependem da escolha do método.
  lista:
  - A composição quase não se relaciona com densidade, esforço, riqueza ou endemicidade (r de no máximo 0,3).
  - >-
    Parte das regiões coincide com ecorregiões conhecidas, como a Floresta Atlântica, a Patagônia e os desertos
    norte-americanos.
- titulo: Publicação
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    Tese de doutorado, Programa de Pós-Graduação em Zoologia, UFMG.
aplicacao: >-
  Regionalizações para planejamento de conservação, escolha de áreas representativas para inventários e estudos
  de impacto em escala regional.
