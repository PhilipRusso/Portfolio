# Prancha do Atlas (português). Edite os textos à vontade; mantenha a indentação.
# Campos com HTML simples (<em>, <strong>, <a>) aparecem formatados no site.
# As imagens ficam em assets/img/. Depois de salvar, o GitHub regera o HTML sozinho.

titulo_aba: Composição e regionalização
nome_curto: Composição e regionalização
rotulo: Américas · Tese de doutorado, 2024 · parte 5 de 5
titulo: Composição e regionalização das aranhas nas Américas
resumo: >-
  Três modelos de diversidade beta, pelo espaço (SCI), pelo ambiente com a distância geográfica e só pelo ambiente
  (GDM), e a regionalização do continente por três métodos de agrupamento.
ficha:
- rotulo: Entrega
  valor: Tese de doutorado, PPG Zoologia, UFMG (cap. 3)
- rotulo: Orientação
  valor: Adalberto J. dos Santos
- rotulo: Meu papel
  valor: 'Autor: banco de dados, análises e mapas'
- rotulo: Ferramentas
  valor: QGIS · BioDinamica (Dinamica EGO) · ArcGIS Pro · R
cartao:
  titulo: Composição e regionalização do continente
  etiqueta: Américas · Tese, parte 5 de 5 · SCI · GDM · 3 regionalizações
  imagem: SpeciesCompositionInterpolation.jpg
  alt: Composição de espécies de aranhas nas Américas pelo SCI, em cores RGB
visor:
  proporcao: 16 / 10
  margem: 12px
  chave: '{modelo}_{mapa}'
  facetas:
    modelo: sci
    mapa: rgb
grupos:
- rotulo: Modelo
  botoes:
  - rotulo: SCI · espaço
    faceta: modelo
    valor: sci
  - rotulo: GDM · ambiente + distância
    faceta: modelo
    valor: geo
  - rotulo: GDM · só ambiente
    faceta: modelo
    valor: amb
  - rotulo: Os três lado a lado
    faceta: modelo
