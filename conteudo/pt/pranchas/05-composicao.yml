    valor: rgb
  - rotulo: Eixo 1
    faceta: mapa
    valor: r
  - rotulo: Eixo 2
    faceta: mapa
    valor: g
  - rotulo: Eixo 3
    faceta: mapa
    valor: b
- rotulo: Regionalização
  botoes:
  - rotulo: CLARA
    faceta: mapa
    valor: clara
  - rotulo: k-means
    faceta: mapa
    valor: kmeans
  - rotulo: Random Forest
    faceta: mapa
    valor: rf
camadas:
- id: sci_rgb
  rotulo: SCI · espaço · RGB
  texto: >-
    Composição interpolada no espaço (SCI), com a distância geográfica como preditora. Os três eixos do NMDS combinados
    em vermelho, verde e azul: cores parecidas indicam composição de espécies parecida.
  legenda:
    itens:
    - cor: '#D13631'
      texto: Eixo 1 → vermelho
    - cor: '#4FAE63'
      texto: Eixo 2 → verde
    - cor: '#2171B5'
      texto: Eixo 3 → azul
  imagens:
  - src: SpeciesCompositionInterpolation.jpg
    alt: 'SCI · espaço: RGB da composição de espécies de aranhas nas Américas'
    geo: [-190.7437, 4.0462, -61.3794, 84.713]
    recorte: [0.06, 0.0, 0.825, 1.0]
