- id: sci_clara
  rotulo: SCI · espaço · CLARA
  texto: >-
    Composição interpolada no espaço (SCI), com a distância geográfica como preditora. Regionalização por CLARA,
    agrupamento por medoides feito para grandes conjuntos de dados.
