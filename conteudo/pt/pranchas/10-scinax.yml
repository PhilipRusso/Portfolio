secoes:
- titulo: O problema
  texto: >-
    Uma perereca do grupo <em>Scinax catharinae</em>, possivelmente uma espécie ainda não descrita, é conhecida
    só no Quadrilátero Ferrífero, região de mineração intensa em Minas Gerais. Antes das campanhas de campo, o projeto
    precisava saber onde a espécie já foi registrada e onde vale procurá-la.
- titulo: Os dados
  texto: >-
    Revisão de oito coleções herpetológicas e de 14 estudos: 130 espécimes ou lotes em sete municípios. Coordenadas
    das coleções, dos coletores ou georreferenciadas a partir da descrição da localidade. Como preditores, as 19
    variáveis bioclimáticas do WorldClim e a altitude, recortadas para o Quadrilátero Ferrífero.
- titulo: O método
  lista_numerada:
  - PCA das variáveis, com os componentes que somam mais de 98% da variância.
  - 'Três algoritmos de aprendizado de máquina: rede neural artificial, SVM e MaxEnt.'
  - Consenso entre os três (ensemble forecasting), com o pacote BioDinamica no Dinamica EGO.
  - Mapa de presença e ausência pelo menor limiar de presença.
  - Extensão de ocorrência pelo mínimo polígono convexo, segundo a IUCN.
- titulo: O resultado
  destaque: >-
    A área adequada se restringe aos topos das serras da encosta leste. Fora das serras já conhecidas, o consenso
    aponta três frentes para buscar novas populações.
  lista:
  - Serra da Piedade.
  - >-
    Serras perto de Itatiaia, Lavras Novas e Santo Antônio do Salto, em Ouro Preto, incluindo o Monumento Natural
    de Itatiaia.
  - Serrinha e Pico do Itacolomi, também em Ouro Preto.
  - 'Registros em duas unidades de conservação: PARNA Serra do Gandarela e RPPN Santuário do Caraça.'
  - >-
    O modelo também prevê áreas bem amostradas onde a espécie provavelmente não ocorre, como a Serra do Rola-Moça:
    história e dispersão ficam fora de um modelo climático.
aplicacao: >-
  Licenciamento ambiental e planos de ação para espécies ameaçadas em áreas de mineração, e planejamento de campanhas
  de campo. O projeto original, em ArcGIS Pro, foi migrado para o QGIS com o conversor da seção Ferramentas.
