secoes:
- titulo: O problema
  texto: >-
    O bicudo é uma das aves mais visadas pelo tráfico de aves canoras no Brasil, classificada como Em Perigo pela
    IUCN e Criticamente em Perigo no país. Os registros confiáveis são poucos e espalhados no tempo. O pedido era
    estimar onde o clima é adequado para a espécie com os dados disponíveis.
- titulo: Os dados
  texto: >-
    22 registros após a limpeza, de 1954 a 2014: coleções do speciesLink (MBML e UNICAMP), Museu Paraense Emílio
    Goeldi e INPA, WikiAves, Taxeus, artigos, um plano de manejo e o Livro Vermelho. Como preditores, três eixos
    de uma PCA das 19 variáveis bioclimáticas recortadas para o Brasil.
- titulo: O método
  lista_numerada:
  - Limpeza e georreferenciamento dos registros, com fonte, instituição e ano.
  - PCA das 19 variáveis bioclimáticas no Brasil, com os três primeiros eixos como preditores.
  - 'Três conjuntos de dados: todos os registros e subconjuntos de 70% e 90%, com o restante separado para teste.'
  - >-
    MaxEnt e dez algoritmos do openModeller: rede neural, Bioclim, Climate Space Model, ENFA, Envelope Score, distância
    ambiental, dois GARP, Niche Mosaic e SVM.
  - Mapa de presença e ausência do MaxEnt pelo limiar do 10º percentil de presença de treino, no ArcMap.
- titulo: O resultado
  destaque: >-
    Com 22 registros, os algoritmos divergem muito. O MaxEnt aponta clima adequado em boa parte do Brasil central,
    da Amazônia e da costa leste.
  lista:
  - Os registros mais antigos vêm de coleções e museus; os mais recentes, de ciência cidadã e da literatura.
  - >-
    GARP com Best Subsets e Niche Mosaic tiveram as maiores AUC de treino, sem contar a distância ambiental, que
    tende a reproduzir os próprios pontos.
  - 'Clima adequado não significa presença: a captura ilegal eliminou a espécie de boa parte da área onde ocorria.'
aplicacao: >-
  Espécies raras ou ameaçadas com poucos registros: escolha do algoritmo, comunicação da incerteza e seleção de
  áreas para busca ou soltura.
