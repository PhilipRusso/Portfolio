secoes:
- titulo: O problema
  texto: >-
    Bases abertas como o GBIF misturam fontes, padrões e níveis de qualidade. O World Spider Catalog tem taxonomia
    confiável, mas geografia imprecisa, restrita à distribuição geral das espécies. Faltava uma base de aranhas
    das Américas com registros rastreáveis até a publicação de origem.
- titulo: Os dados
  texto: >-
    World Spider Catalog, versão 24.0: exportação diária de espécies, páginas de família, lista de referências e
    PDFs dos artigos. Divisões administrativas do ISO 3166 e do GADM, e gazetteers como USGS, IBGE e GeoHack.
- titulo: O método
  lista_numerada:
  - Modelo entidade-relacionamento no MySQL Workbench, com 13 entidades e termos do Darwin Core.
  - >-
    Normalização até a forma normal de Boyce-Codd, chaves primárias e estrangeiras e restrições de tipo, unicidade
    e nulidade.
  - Taxonomia, gazetteer e fontes usadas como ontologias, para controlar a entrada das ocorrências.
  - >-
    Extração dos registros dos artigos com macros próprias para limpar e estruturar o texto; nomes validados contra
    a taxonomia e localidades contra o gazetteer.
  - Cálculo da vida útil (shelf life) das espécies e dos registros.
- titulo: O resultado
  destaque: >-
    16.679 espécies válidas nas Américas, cerca de 34% da diversidade mundial de aranhas, em 95 famílias e 48.593
    localidades georreferenciadas.
  lista:
  - 'Cada registro guarda o histórico taxonômico: sinonímias e mudanças de nome ao longo do tempo.'
  - >-
    Entre a primeira coleta e a descrição de uma espécie passam em média 25 anos (mediana de 18), acima das estimativas
    anteriores para aranhas, de 15 a 17 anos. O atraso cresceu a partir dos anos 2000.
  - A base sustenta as análises de diversidade da prancha 1.
aplicacao: >-
  Integração de bases heterogêneas, modelagem de dados com padrões abertos e controle de qualidade em dados ambientais
  e de biodiversidade.
