secoes:
- titulo: O problema
  texto: >-
    Áreas de endemismo são regiões onde várias espécies têm distribuição restrita e sobreposta. Delimitá-las exige
    um método que não dependa de grades arbitrárias e que funcione com dados desiguais.
- titulo: Os dados
  texto: >-
    Os registros da prancha 1. A amplitude de cada espécie é a distância entre o centroide da sua distribuição e
    o ponto de ocorrência mais distante.
- titulo: O método
  lista_numerada:
  - Interpolação geográfica do endemismo (GIE) no BioDinamica, com estimador de densidade Kernel.
  - >-
    Nove classes de amplitude: até 50 km, 51–200, 201–400, 401–600, 601–800, 801–1.000, 1.001–1.500, 1.501–2.000
    e mais de 2.000 km.
  - Mapa de consenso das classes e mapas por classe.
  - Correlação com os mapas de viés, de riqueza e de endemicidade, e I de Moran por classe.
- titulo: O resultado
  destaque: >-
    São 255 áreas de endemismo para aranhas nas Américas. Quanto mais fina a classe, mais áreas restritas aparecem.
  lista:
  - O sul e o sudeste do Brasil e a Amazônia brasileira concentram mais áreas de endemismo.
  - As classes mais restritas quase não se relacionam com a densidade de registros (r = 0,1 na classe 1).
  - 'A agregação espacial cresce com a amplitude: I de Moran de 0,08 na classe 1 e de 0,95 na classe 4.'
- titulo: Publicação
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    Tese de doutorado, Programa de Pós-Graduação em Zoologia, UFMG.
aplicacao: >-
  Delimitação de áreas prioritárias e de unidades de conservação, e análise de impactos sobre espécies endêmicas.
