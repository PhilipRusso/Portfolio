secoes:
- titulo: O pedido
  texto: >-
    Dois projetos paralelos de ecologia aquática precisavam de mapas de localização claros: dezenas de reservatórios
    espalhados pelo país, com agrupamentos densos no Sudeste, e uma série de pontos de coleta ao longo de um lago
    estreito na Amazônia.
- titulo: A solução
  lista:
  - Reservatórios numerados, com a lista na legenda, sobre ecorregiões de água doce e sobre bacias hidrográficas.
  - Quadros de detalhe onde os pontos se sobrepõem na escala nacional.
  - >-
    Para o lago Puruzinho, um mapa de situação no Amazonas e no Brasil ligado ao detalhe do lago, com os pontos
    rotulados e a escala gráfica.
  - Base e símbolos no ArcMap, com acabamento do layout no Illustrator.
aplicacao: Mapas de localização e de área de estudo para artigos, relatórios técnicos e estudos ambientais.
