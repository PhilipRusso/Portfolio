secoes:
- titulo: O problema
  texto: >-
    Mapas de riqueza feitos só com registros mostram tanto a diversidade quanto o esforço de coleta. Prever a riqueza
    a partir do ambiente ajuda a enxergar onde ela deve ser alta mesmo onde pouco se coletou.
- titulo: Os dados
  texto: >-
    Os 88.684 registros da prancha 1, agregados em hexágonos de 1°. Como preditores, uma PCA das 19 variáveis bioclimáticas
    e da altitude do WorldClim e da evapotranspiração real do USGS, com 2,5′ de resolução; os quatro primeiros componentes
    somam 97% da variação.
- titulo: O método
  lista_numerada:
  - Riqueza observada por hexágono de 1° no BioDinamica.
  - Interpolação da riqueza observada por krigagem e por spline.
  - >-
    Previsão da riqueza por cinco algoritmos (GAM, GLM, MARS, Random Forest e SVM), com os componentes principais
    do ambiente como preditores.
  - Correlação com os mapas de viés da prancha 1 e comparação entre as previsões.
- titulo: O resultado
  destaque: >-
    A riqueza observada acompanha o esforço de coleta; as previsões feitas a partir do ambiente dependem bem menos
    dele.
  lista:
  - >-
    Picos de riqueza observada na Colômbia, no Equador, no Peru, no Brasil, na Bolívia, no México, na América Central
    e no Caribe.
  - A riqueza observada tem correlação alta com a densidade de registros (r = 0,7).
- titulo: Publicação
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    Tese de doutorado, Programa de Pós-Graduação em Zoologia, UFMG.
aplicacao: >-
  Priorização de áreas para inventário e estimativa da riqueza esperada onde não há coleta, com o viés de amostragem
  explícito.
