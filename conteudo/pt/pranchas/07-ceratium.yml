secoes:
- titulo: O problema
  texto: >-
    <em>Ceratium furcoides</em> é um dinoflagelado de água doce, originário de regiões temperadas, que forma florações
    associadas à mortandade de peixes e à piora da qualidade da água. Na América do Sul, ele se espalha por reservatórios.
    Duas perguntas guiaram o trabalho: a espécie ocupa nas áreas invadidas o mesmo nicho climático da área de origem?
    E para onde pode se expandir com as mudanças climáticas e a construção de novas barragens?
- titulo: Os dados
  lista:
  - Registros de ocorrência na área nativa e nas áreas invadidas.
  - Variáveis bioclimáticas do WorldClim para o presente e para os cenários do CMIP6.
  - Localização de grandes barragens existentes e planejadas.
- titulo: O método
  lista_numerada:
  - 'Três calibrações no MaxEnt: só a área nativa, só as áreas invadidas e todos os registros.'
  - Comparação dos nichos nativo e invadido.
  - >-
    Projeção para quatro cenários SSP com até nove modelos climáticos globais, em 34 combinações, resumidas em mapas
    de consenso por cenário.
  - Sobreposição das áreas adequadas com as grandes barragens existentes e planejadas.
- titulo: O resultado
  destaque: >-
    O nicho fundamental da espécie mudou durante a invasão global. Até 2041–2060, as áreas adequadas tendem a se
    expandir e a se sobrepor a grandes barragens existentes e planejadas.
  depois: >-
    Como a espécie pode se estabelecer a partir de uma única célula e forma estruturas de resistência, os artigos
    recomendam detecção precoce e medidas de mitigação nas bacias de maior risco.
- titulo: Publicações
  publicacoes:
  - >-
    Macêdo RL, Franco ACS, <strong>Russo P</strong> et al. (2021). Climate and landscape changes enhance the global
    spread of a bloom-forming dinoflagellate related to fish kills and water quality deterioration. <em>Ecological
    Indicators</em> 133: 108408. <a href="https://doi.org/10.1016/j.ecolind.2021.108408" style="color: #111111">doi
    ↗</a>
  - >-
    Macêdo RL, <strong>Russo P</strong>, Corrêa RF et al. (2021). The drifting dinoflagellate <em>Ceratium furcoides</em>:
    fundamental niche shift during global invasion. <em>Hydrobiologia</em> 848: 2105–2117. <a href="https://doi.org/10.1007/s10750-020-04495-5"
    style="color: #111111">doi ↗</a>
aplicacao: >-
  Risco de espécies invasoras para abastecimento e geração de energia, pragas em plantios florestais e planejamento
  de monitoramento sob cenários climáticos.
