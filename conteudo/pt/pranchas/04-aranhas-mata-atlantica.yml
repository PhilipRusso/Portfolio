numeros:
- valor: '5.482'
  texto: registros não duplicados no bioma
- valor: '842'
  texto: espécies de 12 famílias (Araneoidea e Pholcidae)
- valor: <4%
  texto: 'dos registros na porção setentrional: 212 registros, 70 espécies'
- valor: '102'
  texto: áreas de endemismo no bioma, 5 delas no norte
secoes:
- titulo: O problema
  texto: >-
    Os registros de aranhas no Brasil se concentram perto de grandes cidades e de instituições de pesquisa antigas,
    o chamado efeito museu. A Mata Atlântica ao norte do rio São Francisco é a parte menos amostrada do bioma. A
    questão era separar os padrões de diversidade que refletem a biologia dos que refletem só onde se coletou mais.
- titulo: Os dados
  texto: >-
    Bancos de ocorrência de Araneoidea e Pholcidae compilados da literatura e recortados para a Mata Atlântica:
    5.482 registros não duplicados de 842 espécies. Menos de 4% estão na porção setentrional. Para o modelo de dissimilaridade,
    19 variáveis bioclimáticas do WorldClim.
- titulo: O método
  lista_numerada:
  - Esforço amostral e riqueza de espécies em hexágonos de 0,5°, com o pacote BioDinamica no Dinamica EGO.
  - Diversidade beta por ordenação NMDS interpolada, separada em turnover e aninhamento.
  - >-
    Modelo de dissimilaridade generalizada (GDM) com a distância geográfica e os cinco primeiros eixos de uma PCA
    das variáveis bioclimáticas.
  - >-
    Áreas de endemismo por interpolação geográfica (GIE) e endemismo ponderado pela área de distribuição das espécies.
  - Padronização dos mapas finais no ArcMap.
- titulo: O resultado
  destaque: >-
    102 áreas de endemismo, coerentes com as quatro grandes regiões já descritas para aranhas. No norte, as áreas
    de endemismo coincidem com os poucos locais bem amostrados.
  lista:
  - 'A riqueza acompanha o número de registros em todo o bioma: parte do padrão é efeito de coleta.'
  - No GDM, a distância geográfica foi o preditor mais importante, seguida pelo primeiro eixo climático.
  - Dos 19 endêmicos da porção setentrional, 12 foram descritos a partir de 2015 ou ainda não têm nome.
  - Os mapas indicam onde priorizar novas coletas.
- titulo: Publicação
  publicacoes:
  - >-
    Carvalho LS, <strong>Russo P</strong>, Brescovit AD, Oliveira-Tomasi M, Oliveira U, Santos AJ. The spider fauna
    of the Brazilian Atlantic Forest: effect of sampling bias on diversity patterns and conservation. Capítulo em
    [livro, editora, ano].
aplicacao: >-
  Diagnóstico de lacunas de dados antes de estudos de impacto, priorização de áreas para inventário de fauna e seleção
  de áreas para conservação.
