secoes:
- titulo: O problema
  texto: >-
    Antes de mapear a diversidade, é preciso saber onde ela foi procurada. Os registros de aranhas se acumulam perto
    de cidades, universidades e museus, e esse viés aparece em qualquer mapa feito com eles.
- titulo: Os dados
  texto: >-
    Registros do SPIDBASE (prancha 6). Dos 148.333 registros nas Américas, ficaram 88.684 com coordenadas de pelo
    menos município (nível 2 do GADM): o recorte que gerou os modelos mais consistentes num teste com nove combinações
    de precisão geográfica.
- titulo: O método
  lista_numerada:
  - Comparação de nove níveis de precisão geográfica por regressão, para escolher o recorte dos dados.
  - Densidade Kernel, com área de influência de 100 km² por registro.
  - Esforço amostral no BioDinamica (Dinamica EGO), em células de 1°.
  - Autocorrelação espacial (I de Moran) e correlação entre os mapas no R.
  - 'Áreas mais conhecidas: sobreposição de esforço e densidade altos.'
- titulo: O resultado
  destaque: >-
    Os registros se concentram em áreas urbanizadas e com pesquisa ativa. Esse mapa de viés é a referência para
    ler as quatro pranchas seguintes.
  lista:
  - A densidade de registros é muito agregada no espaço (I de Moran = 0,91).
  - As 63 áreas mais conhecidas vão do Chile ao Canadá e se espalham por 13 países.
  - 'Churchill, em Manitoba, é exceção: uma área muito estudada, apesar da baixa densidade populacional.'
- titulo: Publicação
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    Tese de doutorado, Programa de Pós-Graduação em Zoologia, UFMG.
aplicacao: >-
  Diagnóstico de lacunas de dados antes de estudos de impacto e planejamento de inventários onde o conhecimento
  é mais fraco.
