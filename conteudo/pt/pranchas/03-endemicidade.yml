  texto: 'algoritmos de previsão: GAM, GLM, MARS, Random Forest e SVM'
secoes:
- titulo: O problema
  texto: >-
    A riqueza não mostra onde estão as espécies exclusivas de uma região. O endemismo ponderado dá mais peso às
    espécies de distribuição restrita, as que mais pesam em decisões de conservação.
- titulo: Os dados
  texto: Os mesmos registros e preditores ambientais das pranchas 1 e 2, em hexágonos de 1°.
- titulo: O método
  lista_numerada:
  - >-
    Endemismo ponderado no BioDinamica: cada espécie recebe um valor inverso à sua área de distribuição, e cada
    hexágono recebe a média corrigida.
  - Interpolação por krigagem e por spline.
  - Previsão por cinco algoritmos (GAM, GLM, MARS, Random Forest e SVM) com os componentes principais do ambiente.
  - Correlação com os mapas de viés, com a riqueza e com as variáveis ambientais.
- titulo: O resultado
  destaque: 'A endemicidade depende pouco do esforço de coleta e da riqueza: é outro retrato da diversidade.'
  lista:
  - Há áreas de endemicidade alta em praticamente todos os países do continente.
  - A correlação com a densidade de registros é baixa (r = 0,3), e com a riqueza, menor ainda (r = 0,2).
- titulo: Publicação
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    Tese de doutorado, Programa de Pós-Graduação em Zoologia, UFMG.
aplicacao: >-
  Seleção de áreas prioritárias para conservação e avaliação de impactos sobre espécies de distribuição restrita.
