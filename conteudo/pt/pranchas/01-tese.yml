secoes:
- titulo: O problema
  texto: >-
    Os dados de distribuição de aranhas vêm de fontes heterogêneas e cheias de lacunas. Dos registros de aranhas
    das Américas no GBIF, só cerca de 26% têm a espécie identificada e dados de coleta. Sem uma base confiável,
    não dá para separar padrão de diversidade de falta de conhecimento num continente inteiro.
- titulo: Os dados
  texto: >-
    O SPIDBASE, banco relacional construído a partir da literatura taxonômica do World Spider Catalog (prancha 2),
    com 148 mil registros rastreáveis até a publicação de origem. Para os gradientes, variáveis de temperatura,
    precipitação, produtividade, estabilidade climática e altitude.
- titulo: O método
  lista_numerada:
  - Densidade de registros e esforço amostral, para medir o viés de coleta.
  - Riqueza e endemicidade observadas e previstas por MARS e Random Forest.
  - Áreas de endemismo por interpolação geográfica (GIE), em classes de amplitude de distribuição.
  - >-
    Composição por NMDS interpolado e por modelo de dissimilaridade generalizada (GDM), e regionalização biogeográfica.
  - Relação espécie-área e gradientes de latitude, altitude e ambiente.
- titulo: O resultado
  destaque: >-
    A diversidade conhecida de aranhas acompanha a densidade populacional humana: boa parte do mapa é viés de coleta.
  lista:
  - >-
    Os padrões coincidem com regiões de alta diversidade já conhecidas, mas divergências como a de Manitoba, no
    Canadá, apontam regiões que pedem mais coleta.
  - >-
    A riqueza é maior perto de 0°, 20°N e 20°S, em altitudes baixas, com temperaturas mais quentes, precipitação
    e produtividade de baixa a média e clima estável.
  - O número de espécies cresce com a área e com a escala de análise.
- titulo: Publicação
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    Tese de doutorado, Programa de Pós-Graduação em Zoologia, UFMG.
aplicacao: >-
  Diagnóstico de lacunas de dados antes de estudos de impacto, priorização de inventários de fauna e uso de dados
  de biodiversidade em escala continental com controle do viés de amostragem.
