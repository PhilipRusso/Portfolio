rotulo: Américas · Dissertação de mestrado, 2019
titulo: 'Aranhas araneoideas das Américas: 260 anos de coleta no mapa da diversidade'
resumo: >-
  Riqueza, composição e endemismo em três recortes no tempo, de 1757 a 2017, para separar o padrão biogeográfico
  da história da coleta.
