ferramentas:
  titulo: Ferramentas
  nota: Código próprio para gargalos de pesquisa. Código fechado; demonstração sob consulta.
  itens:
  - nome: Minerador de registros
    texto: >-
      Extrai o material examinado de artigos taxonômicos em PDF para tabelas validadas, com herança de localidade
      e registro dos erros dos próprios artigos. Em outubro de 2026, processou 80 artigos e 3.263 registros.
    tecnologias: Python · PyMuPDF
  - nome: Extrator do World Spider Catalog
    texto: Percorre o catálogo família por família e grava gêneros, espécies e referências taxonômicas em CSVs incrementais.
    tecnologias: Python · web scraping
  - nome: Conversor ArcGIS Pro → QGIS
    texto: >-
      Lê a estrutura interna dos arquivos .aprx e recria o projeto no QGIS com simbologia, temas e layouts de
      impressão. Converteu os projetos das pranchas 4 e 6, com 167 camadas.
    tecnologias: PyQGIS · GDAL
  - nome: Gerador de grades regulares
    texto: >-
      Malhas quadradas ou hexagonais em Shapefile, em WGS 84 e em sistema projetado, com área geodésica e validação
      contra a confusão entre metros e graus.
    tecnologias: Python · pyproj

