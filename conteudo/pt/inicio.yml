    Sou biólogo, mestre e doutor em Zoologia pela UFMG, com MBA em Gestão de Negócios. Passei cerca de oito anos na
    UFMG em biogeografia e macroecologia, com bancos de dados biológicos e espaciais e modelagem de distribuição de
    espécies.
  - Hoje atendo, como autônomo, projetos acadêmicos e consultorias ambientais com análises de dados e mapas temáticos.
