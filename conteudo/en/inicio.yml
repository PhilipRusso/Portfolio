ferramentas:
  titulo: Tools
  nota: Custom code for research bottlenecks. Closed source; demo on request.
  itens:
  - nome: Record miner
    texto: >-
      Extracts the examined material from taxonomic papers in PDF into validated tables, with locality inheritance
      and a log of errors in the papers themselves. As of October 2026, it has processed 80 papers and 3,263 records.
    tecnologias: Python · PyMuPDF
  - nome: World Spider Catalog extractor
    texto: Crawls the catalog family by family and writes genera, species and taxonomic references to incremental CSVs.
    tecnologias: Python · web scraping
  - nome: ArcGIS Pro → QGIS converter
    texto: >-
      Reads the internal structure of .aprx files and rebuilds the project in QGIS with symbology, map themes and print
      layouts. It converted the projects of plates 4 and 6, with 167 layers.
    tecnologias: PyQGIS · GDAL
  - nome: Regular grid generator
    texto: >-
      Square or hexagonal grids as Shapefiles, in WGS 84 and in a projected system, with geodesic area and a check
      against mixing up metres and degrees.
    tecnologias: Python · pyproj

