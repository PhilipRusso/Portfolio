secoes:
- titulo: The problem
  texto: >-
    Continental diversity maps are often read as a portrait of nature, but they also record where and when people
    collected. Araneoidea, the largest and best-studied superfamily of spiders, was a good model to measure this
    effect in the Americas.
- titulo: The data
  texto: >-
    Taxonomic literature from the World Spider Catalog: about 1,850 papers analysed, 550 with geographic information.
    The result was 27,396 records, georeferenced in Google Earth Pro into 25,115 points and 8,642 localities, organized
    in a record catalogue and a gazetteer.
- titulo: The method
  lista_numerada:
  - Richness on a 1° hexagon grid in ArcMap and kernel density of records.
  - >-
    Composition by NMDS with the Bray–Curtis index, interpolated in Dinamica EGO and split into turnover and nestedness.
  - Areas of endemism by geographic interpolation (GIE), in range-size classes.
  - Three time slices, up to 1892, 1971 and 2017, set by natural breaks in the publication years of the records.
  - >-
    For each slice, 100 replicates with the same number of records drawn from the full dataset, to separate the
    effect of time from the effect of data volume; comparison by regression in Past.
  - Country cartograms, with area proportional to the number of species.
- titulo: The result
  destaque: 'Known Araneoidea richness follows record density (r = 0.7): the diversity map is also a map of collecting.'
  lista:
  - >-
    Southern and south-eastern Brazil and the south-eastern United States combine high richness with high accumulated
    collecting effort.
  - Areas of endemism change a lot as new data come in.
  - >-
    Species composition depends less on collecting history, and its breaks resemble natural divisions based on climate
    and vegetation.
  - Up to 1892, only two species of Araneoidea were known from Mexico; by 1971 there were 112.
- titulo: Publication
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2019). Padrões biogeográficos e estruturação do conhecimento taxonômico das aranhas
    araneoideas americanas [Biogeographic patterns and the structure of taxonomic knowledge of American araneoid
    spiders]. MSc dissertation, Graduate Program in Zoology, UFMG.
aplicacao: >-
  Checking whether a spatial pattern is real or a sampling artefact before using it in a decision, and pointing
  to where new sampling would change knowledge the most.
