secoes:
- titulo: The problem
  texto: >-
    Before mapping diversity, you need to know where it was looked for. Spider records pile up near cities, universities
    and museums, and that bias shows up in any map made with them.
- titulo: The data
  texto: >-
    Records from SPIDBASE (plate 6). Of the 148,333 records from the Americas, 88,684 had coordinates precise to
    at least the municipality (GADM level 2): the subset that produced the most consistent models in a test of nine
    combinations of geographic precision.
- titulo: The method
  lista_numerada:
  - Comparison of nine levels of geographic precision by regression, to choose the data subset.
  - Kernel density, with a 100 km² area of influence per record.
  - Sampling effort in BioDinamica (Dinamica EGO), in 1° cells.
  - Spatial autocorrelation (Moran’s I) and correlation between maps in R.
  - 'Best-known areas: overlap of high effort and high density.'
- titulo: The result
  destaque: >-
    Records concentrate in urbanized areas with active research. This bias map is the reference for reading the
    next four plates.
  lista:
  - Record density is highly clustered in space (Moran’s I = 0.91).
  - The 63 best-known areas run from Chile to Canada and are spread across 13 countries.
  - 'Churchill, in Manitoba, is an exception: a well-studied area despite its low population density.'
- titulo: Publication
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    PhD thesis, Graduate Program in Zoology, UFMG.
aplicacao: Diagnosing data gaps before impact assessments and planning surveys where knowledge is weakest.
