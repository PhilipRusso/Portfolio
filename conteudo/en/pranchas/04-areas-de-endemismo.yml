secoes:
- titulo: The problem
  texto: >-
    Areas of endemism are regions where several species have restricted, overlapping ranges. Delimiting them requires
    a method that does not depend on arbitrary grids and that works with uneven data.
- titulo: The data
  texto: >-
    The records from plate 1. The range of each species is the distance between the centroid of its distribution
    and its farthest occurrence point.
- titulo: The method
  lista_numerada:
  - Geographic interpolation of endemism (GIE) in BioDinamica, with a kernel density estimator.
  - >-
    Nine range-size classes: up to 50 km, 51–200, 201–400, 401–600, 601–800, 801–1,000, 1,001–1,500, 1,501–2,000
    and over 2,000 km.
  - Consensus map of the classes and maps per class.
  - Correlation with the bias, richness and endemicity maps, and Moran’s I per class.
- titulo: The result
  destaque: >-
    There are 255 areas of endemism for spiders in the Americas. The finer the class, the more restricted areas
    appear.
  lista:
  - Southern and south-eastern Brazil and the Brazilian Amazon concentrate the most areas of endemism.
  - The most restricted classes are barely related to record density (r = 0.1 in class 1).
  - 'Spatial clustering grows with range size: Moran’s I of 0.08 in class 1 and 0.95 in class 4.'
- titulo: Publication
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    PhD thesis, Graduate Program in Zoology, UFMG.
aplicacao: Delimiting priority areas and protected areas, and analysing impacts on endemic species.
