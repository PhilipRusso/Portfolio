secoes:
- titulo: The problem
  texto: >-
    A tree frog of the <em>Scinax catharinae</em> group, possibly an undescribed species, is known only from the
    Quadrilátero Ferrífero, an intensively mined region in Minas Gerais. Before the field campaigns, the project
    needed to know where the species had been recorded and where it was worth searching.
- titulo: The data
  texto: >-
    A review of eight herpetological collections and 14 studies: 130 specimens or lots in seven municipalities.
    Coordinates from the collections, from the collectors or georeferenced from the locality description. As predictors,
    the 19 WorldClim bioclimatic variables and altitude, clipped to the Quadrilátero Ferrífero.
- titulo: The method
  lista_numerada:
  - PCA of the variables, keeping the components that add up to more than 98% of the variance.
  - 'Three machine-learning algorithms: artificial neural network, SVM and MaxEnt.'
  - Consensus of the three (ensemble forecasting), with the BioDinamica package in Dinamica EGO.
  - Presence–absence map using the lowest presence threshold.
  - Extent of occurrence by minimum convex polygon, following IUCN.
- titulo: The result
  destaque: >-
    Suitable area is restricted to the ridge tops of the eastern slope. Outside the known ranges, the consensus
    points to three fronts to search for new populations.
  lista:
  - Serra da Piedade.
  - >-
    Ranges near Itatiaia, Lavras Novas and Santo Antônio do Salto, in Ouro Preto, including the Itatiaia Natural
    Monument.
  - Serrinha and Pico do Itacolomi, also in Ouro Preto.
  - 'Records in two protected areas: Serra do Gandarela National Park and the Santuário do Caraça private reserve.'
  - >-
    The model also predicts well-sampled areas where the species probably does not occur, such as Serra do Rola-Moça:
    history and dispersal are outside the scope of a climate model.
aplicacao: >-
  Environmental licensing and action plans for threatened species in mining areas, and planning of field campaigns.
  The original ArcGIS Pro project was migrated to QGIS with the converter in the Tools section.
