rotulo: Americas · PhD thesis, 2024 · part 3 of 5
titulo: 'Spider endemicity: where range-restricted species concentrate'
resumo: >-
  Observed weighted endemism, interpolated by kriging and by spline, and predicted by five algorithms: each species
  weighs the inverse of its range size.
