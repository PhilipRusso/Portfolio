secoes:
- titulo: The problem
  texto: >-
    Richness does not show where the species exclusive to a region are. Weighted endemism gives more weight to range-restricted
    species, the ones that weigh most in conservation decisions.
- titulo: The data
  texto: The same records and environmental predictors as plates 1 and 2, in 1° hexagons.
- titulo: The method
  lista_numerada:
  - >-
    Weighted endemism in BioDinamica: each species receives a value inverse to its range size, and each hexagon
    receives the corrected mean.
  - Interpolation by kriging and by spline.
  - >-
    Prediction by five algorithms (GAM, GLM, MARS, Random Forest and SVM) with the principal components of the environment.
  - Correlation with the bias maps, with richness and with the environmental variables.
- titulo: The result
  destaque: 'Endemicity depends little on collecting effort and on richness: it is another portrait of diversity.'
  lista:
  - There are areas of high endemicity in practically every country of the continent.
  - The correlation with record density is low (r = 0.3), and with richness even lower (r = 0.2).
- titulo: Publication
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    PhD thesis, Graduate Program in Zoology, UFMG.
aplicacao: Selecting priority areas for conservation and assessing impacts on range-restricted species.
