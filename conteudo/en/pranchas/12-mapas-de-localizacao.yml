secoes:
- titulo: The brief
  texto: >-
    Two parallel aquatic ecology projects needed clear location maps: dozens of reservoirs spread across the country,
    with dense clusters in the south-east, and a series of sampling points along a narrow lake in the Amazon.
- titulo: The solution
  lista:
  - Numbered reservoirs, listed in the legend, over freshwater ecoregions and over river basins.
  - Insets where points overlap at the national scale.
  - >-
    For Lake Puruzinho, a locator map of Amazonas and Brazil linked to the detail of the lake, with labelled points
    and a scale bar.
  - Base and symbols in ArcMap, with the layout finished in Illustrator.
aplicacao: Location and study-area maps for papers, technical reports and environmental studies.
