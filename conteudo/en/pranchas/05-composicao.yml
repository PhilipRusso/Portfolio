titulo_aba: Composition and regionalization
nome_curto: Composition and regionalization
rotulo: Americas · PhD thesis, 2024 · part 5 of 5
titulo: Composition and regionalization of spiders in the Americas
resumo: >-
  Three beta-diversity models, through space (SCI), through the environment with geographic distance, and through
  the environment alone (GDM), and the regionalization of the continent by three clustering methods.
ficha:
- rotulo: Deliverable
  valor: PhD thesis, Graduate Program in Zoology, UFMG (ch. 3)
- rotulo: Advisor
  valor: Adalberto J. dos Santos
- rotulo: My role
  valor: 'Author: database, analyses and maps'
- rotulo: Tools
  valor: QGIS · BioDinamica (Dinamica EGO) · ArcGIS Pro · R
cartao:
  titulo: Composition and regionalization of the continent
  etiqueta: Americas · Thesis, part 5 of 5 · SCI · GDM · 3 regionalizations
  imagem: SpeciesCompositionInterpolation.jpg
  alt: Spider species composition in the Americas by SCI, in RGB colours
  banner: home_tese5.jpg
  banner_alt: 'Three maps of the Americas in RGB colours: spider species composition by SCI and by the GDM models with geographic distance and with environment only'
