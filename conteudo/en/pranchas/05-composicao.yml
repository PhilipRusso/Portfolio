  texto: 'maps: RGB, three axes and three regionalizations per model'
secoes:
- titulo: The problem
  texto: >-
    Richness and endemism do not say which regions have similar faunas. To regionalize the continent without relying
    on political borders, you need to measure how species composition changes across space and along the environment.
- titulo: The data
  texto: >-
    The records from plate 1 in 1° hexagons, and the principal components of the environment used in the predictions
    of plates 2 and 3.
- titulo: The method
  lista_numerada:
  - Bray-Curtis dissimilarity between hexagons, summarized by NMDS on three axes.
  - 'SCI: interpolation of composition, with geographic distance as a predictor.'
  - 'GDM: composition modelled by environmental gradients, with and without geographic distance.'
  - Combination of the three axes in RGB.
  - 'Regionalization by three clustering methods: CLARA, k-means and Random Forest.'
- titulo: The result
  destaque: >-
    Comparing models and methods shows which biogeographic boundaries recur and which depend on the choice of method.
  lista:
  - Composition is barely related to density, effort, richness or endemicity (r of at most 0.3).
  - Some regions match known ecoregions, such as the Atlantic Forest, Patagonia and the North American deserts.
- titulo: Publication
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    PhD thesis, Graduate Program in Zoology, UFMG.
aplicacao: >-
  Regionalizations for conservation planning, choosing representative areas for surveys and regional-scale impact
  studies.
