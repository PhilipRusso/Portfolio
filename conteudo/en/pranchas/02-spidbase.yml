secoes:
- titulo: The problem
  texto: >-
    Open databases such as GBIF mix sources, standards and quality levels. The World Spider Catalog has reliable
    taxonomy but imprecise geography, limited to the general range of each species. There was no database of spiders
    of the Americas with records traceable to the original publication.
- titulo: The data
  texto: >-
    World Spider Catalog, version 24.0: daily species export, family pages, reference list and the PDFs of the papers.
    Administrative divisions from ISO 3166 and GADM, and gazetteers such as USGS, IBGE and GeoHack.
- titulo: The method
  lista_numerada:
  - Entity-relationship model in MySQL Workbench, with 13 entities and Darwin Core terms.
  - Normalization to Boyce–Codd normal form, primary and foreign keys, and type, uniqueness and null constraints.
  - Taxonomy, gazetteer and sources used as ontologies to control the entry of occurrences.
  - >-
    Extraction of records from the papers with custom macros to clean and structure the text; names validated against
    the taxonomy and localities against the gazetteer.
  - Shelf-life calculation for species and records.
- titulo: The result
  destaque: >-
    16,679 valid species in the Americas, about 34% of the world’s spider diversity, in 95 families and 48,593 georeferenced
    localities.
  lista:
  - 'Every record keeps its taxonomic history: synonymies and name changes over time.'
  - >-
    On average 25 years pass between the first collection and the description of a species (median 18), above previous
    estimates for spiders of 15 to 17 years. The delay grew from the 2000s on.
  - The database underpins the diversity analyses in plate 1.
aplicacao: >-
  Integrating heterogeneous databases, data modelling with open standards and quality control for environmental
  and biodiversity data.
