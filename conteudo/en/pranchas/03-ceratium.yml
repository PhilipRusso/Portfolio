secoes:
- titulo: The problem
  texto: >-
    <em>Ceratium furcoides</em> is a freshwater dinoflagellate native to temperate regions that forms blooms linked
    to fish kills and declining water quality. In South America it spreads through reservoirs. Two questions guided
    the work: does the species occupy the same climatic niche in invaded areas as in its native range? And where
    could it expand with climate change and the construction of new dams?
- titulo: The data
  lista:
  - Occurrence records in the native range and in the invaded ranges.
  - WorldClim bioclimatic variables for the present and for the CMIP6 scenarios.
  - Locations of existing and planned large dams.
- titulo: The method
  lista_numerada:
  - 'Three MaxEnt calibrations: native range only, invaded ranges only and all records.'
  - Comparison of the native and invaded niches.
  - >-
    Projection to four SSP scenarios with up to nine global climate models, in 34 combinations, summarized as consensus
    maps per scenario.
  - Overlay of suitable areas with existing and planned large dams.
- titulo: The result
  destaque: >-
    The species’ fundamental niche shifted during the global invasion. By 2041–2060, suitable areas tend to expand
    and overlap with existing and planned large dams.
  depois: >-
    Because the species can establish from a single cell and forms resting stages, the papers recommend early detection
    and mitigation in the highest-risk basins.
- titulo: Publications
  publicacoes:
  - >-
    Macêdo RL, Franco ACS, <strong>Russo P</strong> et al. (2021). Climate and landscape changes enhance the global
    spread of a bloom-forming dinoflagellate related to fish kills and water quality deterioration. <em>Ecological
    Indicators</em> 133: 108408. <a href="https://doi.org/10.1016/j.ecolind.2021.108408" style="color: #111111">doi
    ↗</a>
  - >-
    Macêdo RL, <strong>Russo P</strong>, Corrêa RF et al. (2021). The drifting dinoflagellate <em>Ceratium furcoides</em>:
    fundamental niche shift during global invasion. <em>Hydrobiologia</em> 848: 2105–2117. <a href="https://doi.org/10.1007/s10750-020-04495-5"
    style="color: #111111">doi ↗</a>
aplicacao: >-
  Risk from invasive species to water supply and hydropower, pests in forest plantations and monitoring plans under
  climate scenarios.
