secoes:
- titulo: The problem
  texto: >-
    The great-billed seed finch is one of the birds most targeted by the songbird trade in Brazil, listed as Endangered
    by the IUCN and as Critically Endangered in the country. Reliable records are few and scattered in time. The
    brief was to estimate where the climate is suitable for the species with the available data.
- titulo: The data
  texto: >-
    22 records after cleaning, from 1954 to 2014: speciesLink collections (MBML and UNICAMP), the Museu Paraense
    Emílio Goeldi and INPA, WikiAves, Taxeus, papers, a management plan and the Brazilian Red Book. As predictors,
    three axes of a PCA of the 19 bioclimatic variables clipped to Brazil.
- titulo: The method
  lista_numerada:
  - Cleaning and georeferencing of the records, with source, institution and year.
  - PCA of the 19 bioclimatic variables for Brazil, with the first three axes as predictors.
  - 'Three datasets: all records and subsets of 70% and 90%, with the rest held out for testing.'
  - >-
    MaxEnt and ten openModeller algorithms: neural network, Bioclim, Climate Space Model, ENFA, Envelope Score,
    environmental distance, two GARP variants, Niche Mosaic and SVM.
  - Presence–absence map from MaxEnt with the 10th percentile training presence threshold, in ArcMap.
- titulo: The result
  destaque: >-
    With 22 records, the algorithms diverge widely. MaxEnt points to suitable climate across much of central Brazil,
    the Amazon and the east coast.
  lista:
  - The oldest records come from collections and museums; the most recent from citizen science and the literature.
  - >-
    GARP with Best Subsets and Niche Mosaic had the highest training AUC, leaving aside environmental distance,
    which tends to reproduce the training points.
  - >-
    Suitable climate does not mean presence: illegal trapping has wiped the species out of much of the area where
    it used to occur.
aplicacao: >-
  Rare or threatened species with few records: choice of algorithm, communication of uncertainty and selection of
  areas to search or for releases.
