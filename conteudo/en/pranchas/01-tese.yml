secoes:
- titulo: The problem
  texto: >-
    Spider distribution data come from heterogeneous, patchy sources. Of the spider records from the Americas in
    GBIF, only about 26% have an identified species and collection data. Without a reliable database, you cannot
    tell diversity patterns apart from gaps in knowledge across a whole continent.
- titulo: The data
  texto: >-
    SPIDBASE, a relational database built from the taxonomic literature of the World Spider Catalog (plate 2), with
    148,000 records traceable to the original publication. For the gradients, variables of temperature, precipitation,
    productivity, climate stability and altitude.
- titulo: The method
  lista_numerada:
  - Record density and sampling effort, to measure collection bias.
  - Observed richness and endemicity, and predictions by MARS and Random Forest.
  - Areas of endemism by geographic interpolation (GIE), in range-size classes.
  - >-
    Composition by interpolated NMDS and by generalized dissimilarity modelling (GDM), and biogeographic regionalization.
  - Species–area relationship and gradients of latitude, altitude and environment.
- titulo: The result
  destaque: 'Known spider diversity follows human population density: much of the map is sampling bias.'
  lista:
  - >-
    The patterns match known high-diversity regions, but mismatches such as Manitoba, in Canada, point to regions
    that need more sampling.
  - >-
    Richness peaks near 0°, 20°N and 20°S, at low altitudes, with warmer temperatures, low to medium precipitation
    and productivity, and stable climate.
  - The number of species grows with area and with the scale of analysis.
- titulo: Publication
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    PhD thesis, Graduate Program in Zoology, UFMG.
aplicacao: >-
  Diagnosing data gaps before impact assessments, prioritizing fauna surveys and using biodiversity data at continental
  scale with control for sampling bias.
