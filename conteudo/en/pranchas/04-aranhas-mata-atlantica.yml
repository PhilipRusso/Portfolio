secoes:
- titulo: The problem
  texto: >-
    Spider records in Brazil cluster near large cities and long-established research institutions, the so-called
    museum effect. The Atlantic Forest north of the São Francisco River is the least sampled part of the biome.
    The question was to separate diversity patterns that reflect biology from those that only reflect where more
    sampling happened.
- titulo: The data
  texto: >-
    Occurrence databases of Araneoidea and Pholcidae compiled from the literature and clipped to the Atlantic Forest:
    5,482 non-duplicated records of 842 species. Fewer than 4% are in the northern part. For the dissimilarity model,
    the 19 WorldClim bioclimatic variables.
- titulo: The method
  lista_numerada:
  - Sampling effort and species richness in 0.5° hexagons, with the BioDinamica package in Dinamica EGO.
  - Beta diversity by interpolated NMDS ordination, split into turnover and nestedness.
  - >-
    Generalized dissimilarity model (GDM) with geographic distance and the first five axes of a PCA of the bioclimatic
    variables.
  - Areas of endemism by geographic interpolation (GIE) and endemism weighted by species range.
  - Final maps standardized in ArcMap.
- titulo: The result
  destaque: >-
    102 areas of endemism, consistent with the four main regions already described for spiders. In the north, areas
    of endemism coincide with the few well-sampled sites.
  lista:
  - 'Richness follows the number of records across the biome: part of the pattern is a sampling effect.'
  - In the GDM, geographic distance was the most important predictor, followed by the first climate axis.
  - Of the 19 species endemic to the northern part, 12 were described from 2015 on or are still unnamed.
  - The maps show where to prioritize new sampling.
- titulo: Publication
  publicacoes:
  - >-
    Carvalho LS, <strong>Russo P</strong>, Brescovit AD, Oliveira-Tomasi M, Oliveira U, Santos AJ. The spider fauna
    of the Brazilian Atlantic Forest: effect of sampling bias on diversity patterns and conservation. Chapter in
    [book, publisher, year].
aplicacao: >-
  Diagnosing data gaps before impact assessments, prioritizing areas for fauna surveys and selecting areas for conservation.
