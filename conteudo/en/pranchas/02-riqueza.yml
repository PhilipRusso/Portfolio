secoes:
- titulo: The problem
  texto: >-
    Richness maps made only from records show both diversity and collecting effort. Predicting richness from the
    environment helps reveal where it should be high even where little has been collected.
- titulo: The data
  texto: >-
    The 88,684 records from plate 1, aggregated in 1° hexagons. As predictors, a PCA of the 19 bioclimatic variables
    and altitude from WorldClim and actual evapotranspiration from USGS, at 2.5′ resolution; the first four components
    add up to 97% of the variation.
- titulo: The method
  lista_numerada:
  - Observed richness per 1° hexagon in BioDinamica.
  - Interpolation of observed richness by kriging and by spline.
  - >-
    Prediction of richness by five algorithms (GAM, GLM, MARS, Random Forest and SVM), with the principal components
    of the environment as predictors.
  - Correlation with the bias maps of plate 1 and comparison between the predictions.
- titulo: The result
  destaque: Observed richness follows collecting effort; predictions made from the environment depend much less
    on it.
  lista:
  - >-
    Peaks of observed richness in Colombia, Ecuador, Peru, Brazil, Bolivia, Mexico, Central America and the Caribbean.
  - Observed richness is strongly correlated with record density (r = 0.7).
- titulo: Publication
  publicacoes:
  - >-
    <strong>Russo P.</strong> (2024). Spider biogeography of the Americas: from literature data to diversity patterns.
    PhD thesis, Graduate Program in Zoology, UFMG.
aplicacao: >-
  Prioritizing areas for surveys and estimating the expected richness where there has been no collecting, with sampling
  bias made explicit.
