rotulo: Americas · PhD thesis, 2024 · part 2 of 5
titulo: 'Spider richness in the Americas: what is observed and what the environment predicts'
resumo: >-
  Observed richness in 1° hexagons, interpolated by kriging and by spline, and predicted from the environment by
  five algorithms: GAM, GLM, MARS, Random Forest and SVM.
