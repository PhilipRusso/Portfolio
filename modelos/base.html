<!doctype html>
<html lang="{{ 'pt-BR' if lang == 'pt' else 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}{% endblock %}</title>
<meta name="description" content="{% block descricao %}{% endblock %}">
<link rel="alternate" hreflang="pt-BR" href="{{ url('pt', pagina) }}">
<link rel="alternate" hreflang="en" href="{{ url('en', pagina) }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E5E4A'/%3E%3Cpath d='M10 7l4.5 2.6v5.2L10 17.4l-4.5-2.6V9.6zM20 7l4.5 2.6v5.2L20 17.4l-4.5-2.6V9.6zM15 15.4l4.5 2.6v5.2L15 25.8l-4.5-2.6V18z' fill='none' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E">
</head>
<body>
{% block conteudo %}{% endblock %}
<footer class="rodape">
<div class="largura rodape__linha">
<span>{{ site.nome }} · {{ site.atlas }}</span>
<span><a href="mailto:{{ site.email }}">{{ site.email }}</a> · <a href="{{ site.linkedin }}">LinkedIn</a></span>
</div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
